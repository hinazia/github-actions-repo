name: Caller Workflow

on: 
    push:
        branches: [main]

jobs:
    build:
        uses: ./.github/workflows/reusable-build.yml
        with: 
            app-name: "my-web-app"
            environment: "Production"
        secrets:
            docker_token: ${{ secrets.DOCKER_TOKEN }}

    read_output:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Prints the output
              run: echo "${{ needs.build.outputs.build_ver }}"


