name: environment variables / Outputs
on: workflow_dispatch
env: 
    APP_NAME: myapp

jobs:
    testing:
        runs-on: self-hosted
        env:
            ENVIRONMENT: staging
        steps: 
            - name: Printing Environment Variables Values
              env:
                VERSION: 1.1.0
              run: |
                echo "$VERSION"
                echo "$ENVIRONMENT"
                echo "$APP_NAME"
                echo "${{ github.sha }}"
                echo "Triggered By: ${{ github.actor }}"
    
    set_output:
        runs-on: self-hosted
        outputs:  # (at job level) — promotes that step-level output up to the job level, so other jobs can see it.
            date: ${{ steps.get_data.outputs.date }}
        steps:
            - name: Set the Date
              id: get_data # names that specific step, so it can be referred to.
              run: echo "date=$(date)" >> $GITHUB_OUTPUT  # actually creates the output at the step level. 
                                                          # Without this, there's nothing to expose.

    read_output:
        runs-on: self-hosted
        needs: set_output
        steps:
            - name: Reads the Date
              run: echo "${{ needs.set_output.outputs.date }}"

    