name: environment variables
on: workflow_dispatch
env: 
    APP_NAME: myapp

jobs:
    testing:
        runs-on: self-hosted
        env:
            ENVIRONMENT: staging
        steps: 
            - name: Printing Environment Variables Values
              env:
                VERSION: 1.1.0
              run: |
                echo "$VERSION"
                echo "$ENVIRONMENT"
                echo "APP_NAME"
                echo "${{ github.sha }}"
                echo "Triggered By: ${{ github.actor }}"
