name: Matrix Build workflow

on: push
       
jobs:
    matrix:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@v6
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                python-version: ${{ matrix.python-version }}
            - name: Print Versions
              run: python --version