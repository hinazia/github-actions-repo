name: multi jobs

on: workflow_dispatch

jobs:
    build:
        runs-on: self-hosted
        steps:
            - name: Print statement
              run: echo "Building the App"  
    test:
        runs-on: self-hosted
        needs: [build]
        steps:
            - name: Print Statement
              run: echo "Running Tests"
    deploy:
        runs-on: self-hosted
        needs: [test]
        steps:
            - name: Print Statment
              run: echo "Deploying"